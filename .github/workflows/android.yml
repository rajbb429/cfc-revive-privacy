name: Build Android app
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # A debug APK you can install on a phone to try the app. It is signed with
      # a throwaway debug key, so it opens with a browser address bar.
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # The Play Store bundle, signed with your upload key when the secrets exist.
      - name: Decode upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.RIBWORK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "path=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "No RIBWORK_KEYSTORE_BASE64 secret: skipping the signed Play Store bundle."
          fi
      - name: Build signed Play Store bundle
        if: steps.key.outputs.path != ''
        env:
          RIBWORK_KEYSTORE: ${{ steps.key.outputs.path }}
          RIBWORK_KEYSTORE_PASSWORD: ${{ secrets.RIBWORK_KEYSTORE_PASSWORD }}
          RIBWORK_KEY_ALIAS: ${{ secrets.RIBWORK_KEY_ALIAS }}
          RIBWORK_KEY_PASSWORD: ${{ secrets.RIBWORK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ribwork-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.path != ''
        with:
          name: ribwork-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
